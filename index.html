<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Cost Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-wrapper">
        <!-- Welcome Header with Theme Toggle -->
        <header class="welcome-header">
            <div class="header-flex">
                <div>
                    <h1 class="main-title">WELCOME, BUDDY.</h1>
                    <p class="subtitle">HARDCORE TRAVEL COST ESTIMATOR</p>
                </div>
                <button type="button" id="theme-toggle" class="theme-icon-btn" title="Toggle Light/Dark Theme">☼</button>
            </div>
        </header>

        <!-- Where To Go Selection -->
        <section class="section-block">
            <h2 class="section-title">WHERE TO GO?</h2>
            <p class="helper-text">Select a destination type to begin your cost calculation.</p>
            
            <div class="destination-grid">
                <button type="button" class="dest-btn" data-type="MOUNTAINS">
                    <span class="dest-tag">[ MOUNTAINS ]</span>
                    <span class="dest-desc">Altitude & Trails</span>
                </button>
                <button type="button" class="dest-btn" data-type="SEA BEACH">
                    <span class="dest-tag">[ SEA BEACH ]</span>
                    <span class="dest-desc">Coastal & Tides</span>
                </button>
                <button type="button" class="dest-btn" data-type="NATIONAL PARK">
                    <span class="dest-tag">[ NATIONAL PARK ]</span>
                    <span class="dest-desc">Wildlife & Nature</span>
                </button>
                <button type="button" class="dest-btn" data-type="URBAN CITY">
                    <span class="dest-tag">[ URBAN CITY ]</span>
                    <span class="dest-desc">Streets & Culture</span>
                </button>
            </div>
        </section>

        <!-- Hardcore Calculator -->
        <section class="section-block calculator-card">
            <h2 class="section-title">TRIP CALCULATOR</h2>
            
            <form id="calculator-form">
                <!-- Location Info -->
                <div class="form-row">
                    <div class="input-group">
                        <label>DESTINATION NAME</label>
                        <input type="text" id="calc-dest" placeholder="Enter place name" required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label>DESTINATION TYPE</label>
                        <input type="text" id="calc-type" placeholder="Select from above" readonly required>
                    </div>
                </div>

                <!-- Clean Transit Info (Multi-Select + Cost) -->
                <div class="form-row">
                    <div class="input-group">
                        <label>TRANSIT MODES (TAP ALL USED)</label>
                        <div class="transit-selector">
                            <button type="button" class="t-mode-btn" data-val="FLIGHT">FLIGHT</button>
                            <button type="button" class="t-mode-btn" data-val="EXPRESS TRAIN">EXPRESS TRAIN</button>
                            <button type="button" class="t-mode-btn" data-val="LOCAL TRAIN">LOCAL TRAIN</button>
                            <button type="button" class="t-mode-btn" data-val="BUS">BUS</button>
                            <button type="button" class="t-mode-btn" data-val="CAB">CAB</button>
                            <button type="button" class="t-mode-btn" data-val="FERRY">FERRY</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>TOTAL TICKETS COST</label>
                        <input type="number" id="calc-transit-cost" class="cost-input" placeholder="0.00" min="0" step="1" required>
                    </div>
                </div>

                <!-- Stay & Duration Info -->
                <div class="form-row">
                    <div class="input-group">
                        <label>ACCOMMODATION PER NIGHT</label>
                        <input type="number" id="calc-hotel-cost" class="cost-input" placeholder="0.00" min="0" step="1" required>
                    </div>
                    <div class="input-group">
                        <label>NUMBER OF NIGHTS</label>
                        <input type="number" id="calc-nights" class="cost-input" placeholder="0" min="0" step="1" required>
                    </div>
                </div>

                <!-- Living Info -->
                <div class="form-row">
                    <div class="input-group">
                        <label>FOOD & ACTIVITIES (PER DAY)</label>
                        <input type="number" id="calc-daily-cost" class="cost-input" placeholder="0.00" min="0" step="1" required>
                    </div>
                    <div class="input-group">
                        <label>NUMBER OF DAYS</label>
                        <input type="number" id="calc-days" class="cost-input" placeholder="0" min="0" step="1" required>
                    </div>
                </div>

                <!-- Live Total Display -->
                <div class="live-total-box">
                    <span class="total-label">ESTIMATED TOTAL TRIP COST</span>
                    <h1 id="live-total" class="total-value">0.00</h1>
                </div>

                <button type="submit" class="primary-btn">SAVE ITINERARY</button>
                <button type="button" id="btn-clear" class="secondary-btn">CLEAR</button>
            </form>
        </section>

        <!-- Saved Itineraries -->
        <section class="section-block">
            <h2 class="section-title">SAVED ITINERARIES</h2>
            <div id="saved-trips-list" class="trips-list">
                <!-- Trip cards will inject here -->
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
